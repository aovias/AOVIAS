# Compatibility shim — prefer:
#   docker compose -f deployment/compose/docker-compose.yml up --build
#   npm run deploy:local

services:
  website:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      target: development
    ports:
      - '3000:3000'
    env_file:
      - ../deployment/environments/.env.development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    volumes:
      - ..:/app
      - website_node_modules:/app/node_modules
      - website_app_node_modules:/app/apps/website/node_modules
      - website_next:/app/apps/website/.next
    working_dir: /app

volumes:
  website_node_modules:
  website_app_node_modules:
  website_next:
