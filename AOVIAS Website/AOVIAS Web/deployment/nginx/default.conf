# AOVIAS Website — reverse proxy (optional compose profile `proxy`)
# Upstream: Next.js standalone on website:3000

upstream aovias_website {
  server website:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 2m;

  # Security headers (edge); Next.js also sets application headers
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    application/manifest+json;

  location /api/health {
    proxy_pass http://aovias_website;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location /api/ready {
    proxy_pass http://aovias_website;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location /_next/static/ {
    proxy_pass http://aovias_website;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://aovias_website;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}
