<article
  class="draft-card"
  [class.selected]="isSelected()"
  [class.archived]="isArchived()"
  (click)="onSelect()"
  role="button"
  [attr.aria-label]="'View draft: ' + draft().title"
>
  <!-- Type badge + status -->
  <header class="draft-card__header">
    <span class="draft-card__type-badge" [ngClass]="typeClass()">
      {{ typeLabel() }}
    </span>
    <span class="draft-card__status-badge" [ngClass]="statusClass()">
      {{ draft().status }}
    </span>
    <span class="draft-card__version">v{{ draft().version }}</span>
  </header>

  <!-- Title + summary -->
  <div class="draft-card__body">
    <h3 class="draft-card__title">{{ draft().title }}</h3>
    <p class="draft-card__summary" *ngIf="draft().summary">
      {{ draft().summary }}
    </p>
  </div>

  <!-- Metadata row -->
  <footer class="draft-card__footer">
    <span class="draft-card__meta">
      <span class="draft-card__meta-label">Generated by</span>
      {{ draft().generatedBy || 'System' }}
    </span>
    <span class="draft-card__meta">
      <span class="draft-card__meta-label">Confidence</span>
      {{ confidencePercent() }}%
    </span>
    <span class="draft-card__meta">
      <span class="draft-card__meta-label">Date</span>
      {{ formattedDate() }}
    </span>

    <!-- Actions -->
    <div class="draft-card__actions" (click)="$event.stopPropagation()">
      <button
        class="btn-action btn-regenerate"
        (click)="onRegenerate()"
        [disabled]="isReadOnly()"
        title="Regenerate draft (creates new version)"
        aria-label="Regenerate draft"
      >
        ↺ Regenerate
      </button>
      <button
        class="btn-action btn-versions"
        (click)="onVersions()"
        title="View version history"
        aria-label="View version history"
      >
        ⟲ Versions
      </button>
    </div>
  </footer>

  <!-- Recommendation origin badge -->
  <div class="draft-card__origin" *ngIf="draft().recommendationId">
    <span class="origin-label">From Recommendation</span>
  </div>
</article>
