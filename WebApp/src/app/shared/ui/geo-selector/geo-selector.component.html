<div class="geo-selector" [formGroup]="form" (blur)="markTouched()">
  @if (effectiveCountryMode !== 'hidden') {
    <mat-form-field appearance="outline" class="geo-field">
      <mat-label>Country</mat-label>
      <mat-select formControlName="countryCode" [disabled]="effectiveCountryMode === 'disabled'">
        <mat-option [value]="countryCodeCtrl.value">India</mat-option>
      </mat-select>
    </mat-form-field>
  }

  <mat-form-field appearance="outline" class="geo-field">
    <mat-label>State</mat-label>
    <mat-select formControlName="stateCode" required>
      @for (s of states; track s.code) {
        <mat-option [value]="s.code">{{ s.name }}</mat-option>
      }
    </mat-select>
    <mat-error *ngIf="stateCodeCtrl.hasError('required')">State is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="geo-field">
    <mat-label>City</mat-label>
    <input
      matInput
      type="text"
      formControlName="cityName"
      [matAutocomplete]="auto"
      [required]="required"
      placeholder="Start typing to search"
    />
    <mat-autocomplete #auto="matAutocomplete">
      @for (c of (filteredCityOptions$ | async) ?? []; track c) {
        <mat-option [value]="c">{{ c }}</mat-option>
      }
    </mat-autocomplete>

    <mat-hint *ngIf="cities.length === 0 && stateCodeCtrl.value">No cities found — enter manually</mat-hint>
    <mat-error *ngIf="cityNameCtrl.hasError('required')">City is required</mat-error>
  </mat-form-field>
</div>
