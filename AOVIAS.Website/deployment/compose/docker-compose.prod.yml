# Production compose — immutable runner image
# One-command deploy (from repo root):
#   npm run deploy:local
# or:
#   docker compose -f deployment/compose/docker-compose.prod.yml up --build -d

name: aovias-website

services:
  website:
    image: aovias-website:r1
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://aovias.com}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    ports:
      - '${HOST_PORT:-3000}:3000'
    env_file:
      - ../environments/.env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Optional edge proxy — enable with: --profile proxy
  proxy:
    profiles: ['proxy']
    image: nginx:1.27-alpine
    ports:
      - '${PROXY_PORT:-8080}:80'
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      website:
        condition: service_healthy
    restart: unless-stopped
