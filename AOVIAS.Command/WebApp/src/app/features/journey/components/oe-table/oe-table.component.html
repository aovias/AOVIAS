<div class="oe-table-wrap praman-scrollbar praman-scrollbar--dense">
  <table aria-label="Objective elements execution table">
    <thead>
      <tr>
        <th scope="col">OE Code</th>
        <th scope="col">Title</th>
        <th scope="col">Classification</th>
        <th scope="col">Score</th>
        <th scope="col">Status</th>
        <th scope="col">Evidence Count</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <app-oe-row [row]="row" (view)="rowView.emit($event)" />
      } @empty {
        <tr>
          <td colspan="7" class="oe-table-wrap__empty">No objective elements available.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
