# AOVIAS / PRAMAN Helm values — Gateway + ComplianceService sample
# Secrets must come from ExternalSecrets / sealed-secrets (not committed here).

nameOverride: ""
fullnameOverride: "aovias"

global:
  imagePullPolicy: IfNotPresent
  aspnetcoreEnvironment: Production

gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: aovias/gateway
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 5212
    targetPort: 5212
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    ASPNETCORE_URLS: "http://+:5212"
    Services__ComplianceService__BaseUrl: "http://aovias-compliance:5016"
    MAINTENANCE_MODE: "false"

compliance:
  enabled: true
  replicaCount: 2
  image:
    repository: aovias/compliance
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 5016
    targetPort: 5016
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  env:
    ASPNETCORE_URLS: "http://+:5016"

ingress:
  enabled: true
  className: nginx
  host: praman.example.com
  tls:
    enabled: false
    secretName: aovias-tls
  annotations: {}

config:
  # Non-secret shared settings (ConfigMap)
  correlationHeader: X-Correlation-ID
  defaultHttpClientTimeoutSeconds: "100"
