{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aovias.fullname" . }}-gateway
  labels:
    {{- include "aovias.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aovias.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- end }}
---
{{- if .Values.compliance.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aovias.fullname" . }}-compliance
  labels:
    {{- include "aovias.labels" . | nindent 4 }}
    app.kubernetes.io/component: compliance
spec:
  type: {{ .Values.compliance.service.type }}
  ports:
    - name: http
      port: {{ .Values.compliance.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aovias.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: compliance
{{- end }}
